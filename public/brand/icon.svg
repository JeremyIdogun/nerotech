<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Left bar -->
  <rect x="4" y="3" width="26" height="94" fill="#12A3A2"/>
  <!-- Diagonal bar: top connects to right edge of left bar, bottom connects to left edge of right bar -->
